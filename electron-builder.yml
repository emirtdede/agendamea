appId: dev.vellium.agendamea
productName: Agendamea
copyright: "Copyright © 2026 Vellium (vellium.dev)"

directories:
  buildResources: electron-resources
  output: release

publish:
  - provider: github
    owner: emirtdede
    repo: agendamea
    releaseType: release

asar: true
asarUnpack:
  - "cli/**"
  - "mcp/**"
  - "dist/**"
  - "dist-server/**"
  - "electron-resources/icon.ico"
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"

files:
  - "cli/**"
  - "mcp/**"
  - "dist/**"
  - "dist-server/**"
  - "electron/**"
  - "electron-resources/icon.ico"
  - "package.json"
  - "!node_modules/**"
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"
  - "node_modules/argparse/**"
  - "node_modules/builder-util-runtime/**"
  - "node_modules/debug/**"
  - "node_modules/electron-updater/**"
  - "node_modules/fs-extra/**"
  - "node_modules/graceful-fs/**"
  - "node_modules/js-yaml/**"
  - "node_modules/jsonfile/**"
  - "node_modules/lazy-val/**"
  - "node_modules/lodash.escaperegexp/**"
  - "node_modules/lodash.isequal/**"
  - "node_modules/ms/**"
  - "node_modules/sax/**"
  - "node_modules/semver/**"
  - "node_modules/tiny-typed-emitter/**"
  - "node_modules/universalify/**"

npmRebuild: true
buildDependenciesFromSource: false

win:
  icon: electron-resources/icon.ico
  legalTrademarks: "Agendamea - Vellium (vellium.dev)"
  requestedExecutionLevel: asInvoker
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
  artifactName: "Agendamea-Setup-${version}-win-${arch}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

portable:
  artifactName: "Agendamea-Portable-${version}-win-${arch}.${ext}"

appx:
  applicationId: Agendamea
  identityName: Vellium.Agendamea
  displayName: Agendamea
  publisher: "CN=1DDB196A-421B-4090-8DC2-62C1AD43C8F0"
  publisherDisplayName: Vellium
  backgroundColor: "#09090b"
  showNameOnTiles: false
  languages:
    - tr-TR
    - en-US
  artifactName: "Agendamea-Store-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agendamea
  menuCategory: false
  uninstallDisplayName: Agendamea
  installerIcon: electron-resources/installer.ico
  uninstallerIcon: electron-resources/uninstaller.ico
  installerHeaderIcon: electron-resources/icon.ico
  installerSidebar: electron-resources/installerSidebar.bmp
  uninstallerSidebar: electron-resources/uninstallerSidebar.bmp
  installerHeader: electron-resources/installerHeader.bmp
  include: electron-resources/installer.nsh
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - tr_TR
    - de_DE
    - fr_FR
    - es_ES
    - it_IT
    - pt_PT
    - pt_BR
    - ru_RU
    - ja_JP
    - ko_KR
    - zh_CN
    - zh_TW
    - ar_SA
    - he_IL
    - nl_NL
    - pl_PL
    - uk_UA
    - cs_CZ
    - sk_SK
    - hu_HU
    - sv_SE
    - da_DK
    - nb_NO
    - fi_FI
    - sq_AL
    - hy_AM
    - id_ID
    - vi_VN
    - th_TH
    - eu_ES
  unicode: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  displayLanguageSelector: true
