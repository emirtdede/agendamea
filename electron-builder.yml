npmRebuild: true
buildDependenciesFromSource: false

win:
  icon: electron-resources/icon.ico
  legalTrademarks: "Agendamea - Vellium (vellium.dev)"
  requestedExecutionLevel: asInvoker
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
  artifactName: "Agendamea-Setup-${version}-win-${arch}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

portable:
  artifactName: "Agendamea-Portable-${version}-win-${arch}.${ext}"
  unpackDirName: true

appx:
  applicationId: Agendamea
  identityName: Vellium.Agendamea
  displayName: Agendamea
  publisher: "CN=1DDB196A-421B-4090-8DC2-62C1AD43C8F0"
  publisherDisplayName: Vellium
  backgroundColor: "#09090b"
  showNameOnTiles: false
  minVersion: "10.0.17763.0"
  maxVersionTested: "10.0.26100.0"
  customExtensionsPath: electron-resources/appx-extensions.xml
  capabilities:
    - runFullTrust
    - internetClient
    - microphone
  languages:
    - tr-TR
    - en-US
  artifactName: "Agendamea-Store-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agendamea
  menuCategory: false
  uninstallDisplayName: Agendamea
  installerIcon: electron-resources/installer.ico
  uninstallerIcon: electron-resources/uninstaller.ico
  installerHeaderIcon: electron-resources/icon.ico
  installerSidebar: electron-resources/installerSidebar.bmp
  uninstallerSidebar: electron-resources/uninstallerSidebar.bmp
  installerHeader: electron-resources/installerHeader.bmp
  include: electron-resources/installer.nsh
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - tr_TR
    - de_DE
    - fr_FR
    - es_ES
    - it_IT
    - pt_PT
    - pt_BR
    - ru_RU
    - ja_JP
    - ko_KR
    - zh_CN
    - zh_TW
    - ar_SA
    - he_IL
    - nl_NL
    - pl_PL
    - uk_UA
    - cs_CZ
    - sk_SK
    - hu_HU
    - sv_SE
    - da_DK
    - nb_NO
    - fi_FI
    - sq_AL
    - hy_AM
    - id_ID
    - vi_VN
    - th_TH
    - eu_ES
  unicode: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  displayLanguageSelector: true
