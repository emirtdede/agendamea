name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build Windows Modern Setup, Portable & Store Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET 10 SDK (Modern WPF Setup)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Biome lint & format check
        run: npm run check:biome

      - name: TypeScript + CJS checkJs type-check
        run: npm run lint

      - name: License compliance & high-severity audit
        run: |
          npm run check:licenses
          npm audit --omit=dev --audit-level=high

      - name: Run unit, integration, UI & coverage gates
        run: |
          npm run test:coverage
          npm run test:ui:coverage

      - name: Run modern WPF Setup tests & strict C# builds
        run: |
          npm run test:setup
          dotnet build installer/Agendamea.Setup/Agendamea.Setup.csproj -c Release --nologo
          dotnet build installer/Agendamea.Cli/Agendamea.Cli.csproj -c Release --nologo

      - name: Verify production bundle budgets
        run: |
          npm run build
          npm run check:budget

      - name: Build Windows x64 Modern Setup, Portable & Store Packages
        run: |
          npm run dist:win
          npm run dist:win:appx
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.exe', '.appx', '.msix', '.yml' -and $_.Name -ne 'builder-debug.yml' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath release\SHA256SUMS.txt -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/Agendamea-Setup-*.exe
            release/Agendamea-Portable-*.exe
            release/Agendamea-Store-*.appx
            release/latest.yml
            release/SHA256SUMS.txt
