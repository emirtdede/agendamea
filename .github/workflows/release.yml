name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build Windows NSIS Installer & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: TypeScript type-check
        run: npm run lint

      - name: Build Windows x64 Setup, Portable & Store Packages
        run: npm run build && npx electron-builder --win nsis portable appx --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.exe', '.appx', '.msix', '.blockmap', '.yml' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath release\SHA256SUMS.txt -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Agendamea-Setup-*.exe
            release/Agendamea-Portable-*.exe
            release/Agendamea-Store-*.appx
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
