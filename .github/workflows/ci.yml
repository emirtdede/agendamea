name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, Unit & Integration Tests, Production Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET 10 SDK (Modern WPF Setup)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type-check
        run: npm run lint

      - name: Run full QA, AI & i18n test suite
        run: npm test

      - name: Run modern WPF Setup engine tests
        run: npm run test:setup

      - name: Build production client & server
        run: npm run build

      - name: Packaged Windows directory smoke check
        run: npm run dist:win:dir
