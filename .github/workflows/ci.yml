name: CI Quality Gate

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  verify:
    name: Enterprise Lint, Security, Tests, Coverage, Build & Smoke
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET 10 SDK (Modern WPF Setup & Native CLI)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Biome lint & format check
        run: npm run check:biome

      - name: Strict TypeScript + CJS checkJs type-check
        run: npm run lint

      - name: Production license compliance & high-severity audit
        run: |
          npm run check:licenses
          npm audit --omit=dev --audit-level=high

      - name: Run full Node unit & integration suite with coverage gates
        run: npm run test:coverage

      - name: Run React 19 UI suite (Vitest + RTL) with coverage gates
        run: npm run test:ui:coverage

      - name: Run modern WPF Setup engine tests & strict C# analyzer builds
        run: |
          npm run test:setup
          dotnet build installer/Agendamea.Setup/Agendamea.Setup.csproj -c Release --nologo
          dotnet build installer/Agendamea.Cli/Agendamea.Cli.csproj -c Release --nologo

      - name: Build production client & server + verify bundle budgets
        run: |
          npm run build
          npm run check:budget

      - name: Real Electron BrowserWindow E2E smoke test (Playwright)
        run: npm run test:e2e

      - name: Packaged Windows directory smoke check
        run: npm run dist:win:dir
