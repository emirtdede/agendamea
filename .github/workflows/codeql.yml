name: CodeQL SAST Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: csharp
            os: windows-latest
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK (C# analysis)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build .NET Installer & CLI Projects
        if: matrix.language == 'csharp'
        run: |
          dotnet build installer/Agendamea.Setup/Agendamea.Setup.csproj -c Release --nologo
          dotnet build installer/Agendamea.Cli/Agendamea.Cli.csproj -c Release --nologo

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
