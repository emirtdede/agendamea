ShortDescription: Fast, offline-first daily task manager and planner for Windows 10/11.
Description: Agendamea is a fast, local-first daily task manager and headless automation suite for Windows 10/11 featuring WAL SQLite persistence, 4 planning views (List, Kanban, Calendar, Eisenhower Matrix), a built-in 20-tool MCP server, short terminal CLI (ag), headless bi-directional webhooks, serverless multi-cloud folder sync (OneDrive, Google Drive, iCloud, Dropbox), custom HEX themes, dynamic system-wide icons, and 73 languages.
