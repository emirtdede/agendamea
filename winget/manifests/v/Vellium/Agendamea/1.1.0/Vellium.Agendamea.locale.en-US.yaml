ShortDescription: Fast, offline-first daily task manager, local AI voice planner, CLI & MCP suite for Windows 10/11.
Description: Agendamea is a free, open-source, local-first daily task manager, on-device neural voice assistant, and headless automation suite for Windows 10/11 featuring WAL SQLite v5 with Hybrid RAG, 4 planning views (List, Kanban, Calendar, Eisenhower Matrix), Spotlight Command Palette (Ctrl+K), optional 4/6/8-digit PIN or Password App Lock with Recovery Code, 100% offline RNNoise/Silero VAD/Piper Neural TTS/Whisper/Qwen3/Ollama voice dictation, Notification Center with Focus Mode, fully customizable keyboard shortcuts, universal right-click context menus, a built-in 23-tool MCP server with 12-client hub, native terminal CLI (ag.exe), headless bi-directional webhooks, serverless multi-cloud folder sync, custom HEX themes, dynamic system-wide icons, 73 languages, and a modern frameless monochrome WPF installer.
